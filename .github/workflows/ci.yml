name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit test + integration test (Testcontainers MySQL 8.4, Docker có sẵn trên runner)
      - run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend — build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Typecheck + build admin và 3 landing (prerender)
      - run: npm run build
      - run: npm test -w apps/admin

  e2e:
    name: E2E — docker compose + Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/admin
      - run: npx playwright test
        working-directory: apps/admin
        env:
          CI: "true"
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color > compose.log; tail -200 compose.log
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/admin/playwright-report
            apps/admin/test-results
      - if: always()
        run: docker compose down -v
